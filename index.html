<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>💘 Valentine</title>

<style>
:root{
  --win:#0b1220;
  --bar:#162033;
  --border:#25304a;
  --fg:#ff9ecb;
  --accent:#ff4d6d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
  background:
    radial-gradient(900px 700px at 20% 20%, #3a1b5a 0%, transparent 60%),
    radial-gradient(900px 700px at 80% 20%, #7b1b3a 0%, transparent 55%),
    linear-gradient(140deg,#070710,#12061a);
  color:white;
}

/* Toast with image */
#toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  pointer-events:none;

  display:flex;
  align-items:center;
  gap:10px;

  background:#ffffff18;
  border:1px solid #ffffff2b;
  backdrop-filter: blur(10px);
  padding:8px 14px;
  border-radius:999px;
  font-weight:900;

  opacity:0;
  transition:opacity .25s ease;
}
#toast.show{ opacity:1; }
#toast img{
  width:28px;
  height:28px;
  object-fit:contain;
}

/* Center card */
.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}

.card{
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:20px;
  padding:28px;
  backdrop-filter:blur(10px);
  text-align:center;
}

button{
  padding:12px 22px;
  margin:10px;
  border-radius:14px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:white;
  font-weight:900;
  cursor:pointer;
  transition:transform .2s ease, background .2s ease;
}
button:hover{ background:#ffffff25; }
button:active{ transform:scale(.96); }

.yes{
  background:linear-gradient(135deg,var(--accent),#c9184a);
}

/* Desktop */
#desktop{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* Terminals */
.term{
  position:absolute;
  width:320px;
  height:240px;
  background:var(--win);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 50px #000000aa;
  display:flex;
  flex-direction:column;
  pointer-events:auto;
  z-index:50; /* above love text & flowers */
}

.bar{
  height:30px;
  background:var(--bar);
  display:flex;
  align-items:center;
  padding:0 10px;
}
.dots{ display:flex; gap:6px; }
.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  cursor:pointer;
}
.dot.red{background:#ff5f57;}
.dot.yellow{background:#febc2e;}
.dot.green{background:#28c840;}

pre{
  margin:0;
  padding:10px;
  color:var(--fg);
  font-size:15px;
  line-height:1.05;
  white-space:pre;
  overflow:hidden;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:left;
}

/* Smooth movement for evasive NO */
#noBtn.evasive{
  position:fixed;
  z-index:9998;
  transition:left .6s ease, top .6s ease;
  transform:none;
}

/* Center love text behind terminals */
#loveCenter{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;            /* behind terminals */
  pointer-events:none;
  text-align:center;
  font-weight:1000;
  letter-spacing:.4px;
  color:#ffffffc2;
  text-shadow: 0 10px 30px #000000aa;
  opacity:0;
  transition: opacity .25s ease;
  font-size: clamp(20px, 3.6vw, 44px);
  width:min(900px, 92vw);
}
#loveCenter.show{ opacity:1; }

/* Bottom signature behind terminals */
#loveBottom{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:5;
  pointer-events:none;
  text-align:center;
  font-weight:1000;
  letter-spacing:.3px;
  color:#ffffffad;
  text-shadow: 0 10px 30px #000000aa;
  opacity:0;
  transition: opacity .25s ease;
  font-size: clamp(14px, 2.3vw, 22px);
}
#loveBottom.show{ opacity:1; }

/* Right-side flowers button (behind terminals so it can be covered) */
#flowersBtn{
  position:fixed;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  z-index:6; /* behind terminals (term is 50) */
  margin:0;

  padding:12px 16px;
  border-radius:999px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:#fff;
  font-weight:1000;
  cursor:pointer;

  opacity:0;
  pointer-events:none;
  transition: opacity .25s ease, transform .25s ease, background .2s ease;
}
#flowersBtn.show{
  opacity:1;
  pointer-events:auto;
}
#flowersBtn:hover{ background:#ffffff25; }
#flowersBtn:active{ transform:translateY(-50%) scale(.96); }

/* Final centered message screen */
#finalScreen{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  z-index:100;
  pointer-events:none;
  opacity:0;
  transition: opacity .25s ease;
}
#finalScreen.show{ opacity:1; }
#finalScreen .finalCard{
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:22px;
  padding:26px 22px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 70px #00000088;
  text-align:center;
  width:min(560px, 92vw);
  font-weight:1000;
  font-size: clamp(20px, 3.2vw, 34px);
}

/* 🌹 Rose confetti */
#roseConfetti{
  position:fixed;
  inset:0;
  z-index:120;
  pointer-events:none;
  overflow:hidden;
}
.rose{
  position:absolute;
  top:-40px;
  font-size:24px;
  will-change: transform;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.55));
  animation: fall var(--dur) linear forwards;
}
@keyframes fall{
  to{
    transform: translate3d(var(--dx), calc(100vh + 80px), 0) rotate(var(--rot));
    opacity: 1;
  }
}
</style>
</head>

<body>

<div id="toast">
  <img id="toastImg" src="" alt="">
  <span id="toastText"></span>
</div>

<div class="center" id="menu">
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>
</div>

<div id="loveCenter">i love you babe! happy valentines day!</div>
<div id="loveBottom">-danny, your valentine.</div>

<button id="flowersBtn">wheres my flowers?</button>

<div id="finalScreen">
  <div class="finalCard">flowers are on your way!</div>
</div>

<div id="roseConfetti"></div>
<div id="desktop"></div>

<script>
const desktop = document.getElementById("desktop");
const menu = document.getElementById("menu");
const toast = document.getElementById("toast");
const toastImg = document.getElementById("toastImg");
const toastText = document.getElementById("toastText");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const loveCenter = document.getElementById("loveCenter");
const loveBottom = document.getElementById("loveBottom");
const flowersBtn = document.getElementById("flowersBtn");
const finalScreen = document.getElementById("finalScreen");
const roseConfetti = document.getElementById("roseConfetti");

/* HEART */
const HEART = `
***         *** 
******   ****** 
*************** 
*************** 
 *************  
  ***********   
    *******     
      ***       
       *        
`.trim();

function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

function closeWindow(win){
  win.style.transition="transform .12s ease, opacity .12s ease";
  win.style.transform="scale(0.95)";
  win.style.opacity="0";
  setTimeout(()=>win.remove(),120);
}

function makeTerminal(x,y){
  const el=document.createElement("div");
  el.className="term";
  el.style.left=x+"px";
  el.style.top=y+"px";

  el.innerHTML=`
    <div class="bar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
    </div>
    <pre></pre>
  `;

  el.querySelector(".dot.red").addEventListener("click",()=>closeWindow(el));
  desktop.appendChild(el);
  return el;
}

function typeHeart(pre,speed=5){
  let i=0;
  const interval=setInterval(()=>{
    pre.textContent+=HEART[i]||"";
    i++;
    if(i>=HEART.length) clearInterval(interval);
  },speed);
}

/* spawn one terminal at exact coordinates (clamped) */
function spawnOneAt(x, y){
  const w = window.innerWidth;
  const h = window.innerHeight;
  const bw = 320;
  const bh = 240;

  const xx = clamp(x, 0, Math.max(0, w - bw));
  const yy = clamp(y, 0, Math.max(0, h - bh));

  const t = makeTerminal(xx, yy);
  const pre = t.querySelector("pre");
  typeHeart(pre, 4);
}

function spawnStorm(count=20){
  const w=window.innerWidth;
  const h=window.innerHeight;

  for(let i=0;i<count;i++){
    const x=rand(0, Math.max(0,w-320));
    const y=rand(0, Math.max(0,h-240));
    const t=makeTerminal(x,y);
    const pre=t.querySelector("pre");
    setTimeout(()=>typeHeart(pre,4), i*90);
  }
}

/* Messages + matching images */
const variants = [
  { text:"Too bad.", img:"img1.png" },
  { text:"i hope ur jokinggg", img:"img2.png" },
  { text:"Incorrect!", img:"img3.png" },
  { text:":(", img:"img4.png" }
];

let lastIndex = -1;
let toastTimer = null;

function getVariant(){
  let i;
  do{ i = rand(0, variants.length-1); }
  while(i === lastIndex);
  lastIndex = i;
  return variants[i];
}

function showToast(){
  if(toastTimer) clearTimeout(toastTimer);

  const v = getVariant();
  toastText.textContent = v.text;
  toastImg.src = v.img;

  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");

  toastTimer = setTimeout(()=>toast.classList.remove("show"),2000);
}

/* YES grows */
let yesScale = 1;
function growYes(){
  yesScale = Math.min(2.5, yesScale + 0.2);
  yesBtn.style.transform = `scale(${yesScale})`;
}

/* NO movement */
let noCount = 0;

function moveNo(){
  const pad = 12;
  const avoidTop = 70;

  const rect = noBtn.getBoundingClientRect();
  const bw = rect.width || 90;
  const bh = rect.height || 44;

  const maxX = Math.max(pad, window.innerWidth - bw - pad);
  const maxY = Math.max(avoidTop, window.innerHeight - bh - pad);

  const x = rand(pad, maxX);
  const y = rand(avoidTop, maxY);

  noBtn.style.left = clamp(x, pad, maxX) + "px";
  noBtn.style.top  = clamp(y, avoidTop, maxY) + "px";
}

function enableEvasive(){
  if(noBtn.classList.contains("evasive")) return;

  noBtn.classList.add("evasive");
  document.body.appendChild(noBtn);

  noBtn.style.left = "50%";
  noBtn.style.top  = "60%";
  noBtn.style.transform = "translate(-50%, -50%)";

  requestAnimationFrame(() => {
    noBtn.style.transform = "";
    moveNo();
  });

  noBtn.addEventListener("mouseenter", moveNo);
}

/* 🌹 Rose confetti */
let roseInterval = null;
let roseStopTimer = null;

function clearRoses(){
  if(roseInterval) { clearInterval(roseInterval); roseInterval = null; }
  if(roseStopTimer) { clearTimeout(roseStopTimer); roseStopTimer = null; }
  roseConfetti.innerHTML = "";
}

function launchRoseConfetti(durationMs = 5000){
  clearRoses();

  const spawn = () => {
    const r = document.createElement("div");
    r.className = "rose";
    r.textContent = "🌹";

    const x = rand(0, Math.max(0, window.innerWidth - 24));
    const dx = rand(-160, 160) + "px";
    const dur = (rand(1800, 3200) / 1000) + "s";
    const rot = rand(-720, 720) + "deg";
    const size = rand(18, 34) + "px";

    r.style.left = x + "px";
    r.style.setProperty("--dx", dx);
    r.style.setProperty("--dur", dur);
    r.style.setProperty("--rot", rot);
    r.style.fontSize = size;

    roseConfetti.appendChild(r);

    // cleanup after fall
    const ms = parseFloat(dur) * 1000 + 250;
    setTimeout(()=>r.remove(), ms);
  };

  // spawn rate
  roseInterval = setInterval(spawn, 80);
  // initial burst
  for(let i=0;i<18;i++) setTimeout(spawn, i*25);

  roseStopTimer = setTimeout(() => {
    if(roseInterval) { clearInterval(roseInterval); roseInterval = null; }
    // allow remaining roses to finish, then clear
    setTimeout(()=>{ roseConfetti.innerHTML=""; }, 3500);
  }, durationMs);
}

/* Clear everything and show final message */
function clearEverythingAndShowFinal(){
  desktop.innerHTML = "";
  loveCenter.classList.remove("show");
  loveBottom.classList.remove("show");
  toast.classList.remove("show");
  flowersBtn.classList.remove("show");
  flowersBtn.style.pointerEvents = "none";
  if (noBtn) noBtn.style.display = "none";
  if (yesBtn) yesBtn.style.display = "none";

  finalScreen.classList.add("show");
  launchRoseConfetti(5200);
}

/* YES click */
yesBtn.addEventListener("click",()=>{
  menu.style.display="none";
  noBtn.style.display = "none";

  loveCenter.classList.add("show");
  loveBottom.classList.add("show");
  flowersBtn.classList.add("show");

  // Ensure coverage: center, bottom signature, flowers button
  const cx = Math.round(window.innerWidth/2 - 160);
  const cy = Math.round(window.innerHeight/2 - 120);
  spawnOneAt(cx + 10, cy + 10);     // over center text
  spawnOneAt(cx + 60, cy + 40);     // another over center text
  spawnOneAt(Math.round(window.innerWidth/2 - 160), Math.max(0, window.innerHeight - 260)); // bottom area
  spawnOneAt(Math.max(0, window.innerWidth - 360), Math.round(window.innerHeight/2 - 120)); // flowers area

  spawnStorm(window.innerWidth<600?8:18);
});

/* NO click */
noBtn.addEventListener("click",()=>{
  noCount++;
  showToast();
  growYes();

  if(noCount >= 3){
    enableEvasive();
    moveNo();
  }
});

/* Keep NO on-screen if resized/rotated */
window.addEventListener("resize", () => {
  if(noBtn.classList.contains("evasive")) moveNo();
});

/* Flowers button */
flowersBtn.addEventListener("click", () => {
  clearEverythingAndShowFinal();
});
</script>

</body>
</html>

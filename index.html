<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>💘 Valentine</title>

<style>
:root{
  --win:#0b1220;
  --bar:#162033;
  --border:#25304a;
  --fg:#ff9ecb;
  --accent:#ff4d6d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
  background:
    radial-gradient(900px 700px at 20% 20%, #3a1b5a 0%, transparent 60%),
    radial-gradient(900px 700px at 80% 20%, #7b1b3a 0%, transparent 55%),
    linear-gradient(140deg,#070710,#12061a);
  color:white;
}

/* Toast */
#toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  pointer-events:none;
  background:#ffffff18;
  border:1px solid #ffffff2b;
  backdrop-filter: blur(10px);
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
  opacity:0;
  transition: opacity .25s ease, transform .25s ease;
}
#toast.show{ opacity:1; }

/* Center card */
.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}

.card{
  position:relative;
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:20px;
  padding:28px 28px 22px;
  backdrop-filter:blur(10px);
  text-align:center;
  width:min(520px, 92vw);
}

.controls{
  margin-top:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  position:relative;
}

/* Heart-shaped YES button */
#yesBtn{
  width:78px;
  height:78px;
  border:0;
  cursor:pointer;
  position:relative;
  transform: rotate(-45deg) scale(1);
  transition: transform .18s ease;
  background: linear-gradient(135deg, var(--accent), #c9184a);
  box-shadow: 0 14px 40px #00000088;
}
#yesBtn::before,
#yesBtn::after{
  content:"";
  position:absolute;
  width:78px;
  height:78px;
  background: inherit;
  border-radius:50%;
}
#yesBtn::before{ top:-39px; left:0; }
#yesBtn::after{ left:39px; top:0; }

/* Add “YES” label on top */
#yesLabel{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  transform: rotate(45deg);
  font-weight:1000;
  letter-spacing:.8px;
  color:white;
  text-shadow: 0 6px 20px #000000aa;
  user-select:none;
}

/* NO button (normal at first) */
#noBtn{
  padding:12px 20px;
  border-radius:14px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:white;
  font-weight:900;
  cursor:pointer;
  transition: transform .12s ease, background .2s ease;
}
#noBtn:hover{ background:#ffffff25; }
#noBtn:active{ transform:scale(.96); }

/* When NO becomes evasive */
#noBtn.evasive{
  position:fixed; /* lets it move anywhere on screen */
  z-index:9998;
}

/* Desktop */
#desktop{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* Terminals */
.term{
  position:absolute;
  width:320px;
  height:240px;
  background:var(--win);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 50px #000000aa;
  display:flex;
  flex-direction:column;
  pointer-events:auto;
}
.bar{
  height:30px;
  background:var(--bar);
  display:flex;
  align-items:center;
  padding:0 10px;
}
.dots{ display:flex; gap:6px; }
.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  cursor:pointer;
}
.dot.red{background:#ff5f57;}
.dot.yellow{background:#febc2e;}
.dot.green{background:#28c840;}

pre{
  margin:0;
  padding:10px;
  color:var(--fg);
  font-size:15px;
  line-height:1.05;
  white-space:pre;
  overflow:hidden;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:left;
}
</style>
</head>

<body>

<div id="toast"></div>

<div class="center">
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="controls" id="controls">
      <button id="yesBtn" aria-label="Yes">
        <span id="yesLabel">YES</span>
      </button>

      <button id="noBtn">NO</button>
    </div>
  </div>
</div>

<div id="desktop"></div>

<script>
const desktop = document.getElementById("desktop");
const card = document.getElementById("card");
const toast = document.getElementById("toast");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

/* HEART ASCII */
const HEART = `
***         *** 
******   ****** 
*************** 
*************** 
 *************  
  ***********   
    *******     
      ***       
       *        
`.trim();

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function closeWindow(win){
  win.style.transition="transform .12s ease, opacity .12s ease";
  win.style.transform="scale(0.95)";
  win.style.opacity="0";
  setTimeout(()=>win.remove(),120);
}

function makeTerminal(x,y){
  const el=document.createElement("div");
  el.className="term";
  el.style.left=x+"px";
  el.style.top=y+"px";

  el.innerHTML=`
    <div class="bar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
    </div>
    <pre></pre>
  `;

  el.querySelector(".dot.red").addEventListener("click",()=>closeWindow(el));
  desktop.appendChild(el);
  return el;
}

function typeHeart(pre,speed=5){
  let i=0;
  const interval=setInterval(()=>{
    pre.textContent+=HEART[i]||"";
    i++;
    if(i>=HEART.length) clearInterval(interval);
  },speed);
}

function spawnStorm(count=20){
  const w=window.innerWidth;
  const h=window.innerHeight;

  for(let i=0;i<count;i++){
    const x=rand(20,Math.max(20,w-360));
    const y=rand(20,Math.max(20,h-260));
    const t=makeTerminal(x,y);
    const pre=t.querySelector("pre");

    setTimeout(()=>typeHeart(pre,4), i*90);
  }
}

/* Toast logic — no repeat */
const noMessages = ["Too bad.", "i hope ur jokinggg", "Incorrect!", ":("];
let lastMessage = null;
let toastTimer = null;

function getRandomMessage(){
  let msg;
  do { msg = noMessages[rand(0,noMessages.length-1)]; }
  while (msg === lastMessage);
  lastMessage = msg;
  return msg;
}

function showToast(msg){
  if(toastTimer) clearTimeout(toastTimer);
  toast.textContent = msg;

  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");

  toastTimer = setTimeout(()=>toast.classList.remove("show"), 2000);
}

/* YES grows with every NO */
let noCount = 0;
let yesScale = 1;

function growYes(){
  yesScale = Math.min(2.4, yesScale + 0.22);
  yesBtn.style.transform = `rotate(-45deg) scale(${yesScale})`;
}

/* After 3 NO presses, NO becomes evasive */
function moveNo(){
  const pad = 12;
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Button size (use current layout)
  const rect = noBtn.getBoundingClientRect();
  const bw = rect.width || 80;
  const bh = rect.height || 40;

  const x = rand(pad, Math.max(pad, w - bw - pad));
  const y = rand(pad, Math.max(pad, h - bh - pad));

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";
}

function enableEvasiveNo(){
  if(noBtn.classList.contains("evasive")) return;
  noBtn.classList.add("evasive");
  // give it an initial move so it’s obviously “alive”
  moveNo();

  // make it dodge on hover too
  noBtn.addEventListener("mouseenter", moveNo);
}

yesBtn.addEventListener("click",()=>{
  // hide the whole card/menu
  card.style.display="none";
  spawnStorm(window.innerWidth < 600 ? 10 : 25);
});

noBtn.addEventListener("click",()=>{
  noCount++;
  showToast(getRandomMessage());
  growYes();

  if(noCount >= 3){
    enableEvasiveNo();
    // also jump immediately on click
    moveNo();
  }
});
</script>

</body>
</html>

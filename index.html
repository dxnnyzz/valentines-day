<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>💘 Valentine</title>

<style>
:root{
  --win:#0b1220;
  --bar:#162033;
  --border:#25304a;
  --fg:#ff9ecb;
  --accent:#ff4d6d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
  background:
    radial-gradient(900px 700px at 20% 20%, #3a1b5a 0%, transparent 60%),
    radial-gradient(900px 700px at 80% 20%, #7b1b3a 0%, transparent 55%),
    linear-gradient(140deg,#070710,#12061a);
  color:white;
}

.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}

.card{
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:20px;
  padding:24px;
  backdrop-filter:blur(10px);
  text-align:center;
}

button{
  padding:12px 18px;
  margin:8px;
  border-radius:14px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{background:#ffffff25}
button:active{transform:scale(.96)}

.yes{
  background:linear-gradient(135deg,var(--accent),#c9184a);
}

#desktop{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.term{
  position:absolute;
  width:320px;
  height:220px;
  background:var(--win);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 50px #000000aa;
}

.bar{
  height:30px;
  background:var(--bar);
}

pre{
  margin:0;
  padding:15px;
  color:var(--fg);
  font-size:14px;
  white-space:pre;
  overflow:auto;
}
</style>
</head>

<body>

<div class="center">
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>
</div>

<div id="desktop"></div>

<script>

const desktop = document.getElementById("desktop");
const card = document.getElementById("card");

const HEART = `
  **     **   
 ****** ****** 
*************** 
 *************  
  ***********   
    *******     
      ***       
       *        
`.trim();

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function makeTerminal(x,y){
  const el = document.createElement("div");
  el.className="term";
  el.style.left=x+"px";
  el.style.top=y+"px";

  el.innerHTML = `
    <div class="bar"></div>
    <pre></pre>
  `;

  desktop.appendChild(el);
  return el;
}

function typeHeart(pre,speed=6){
  let i=0;
  const interval=setInterval(()=>{
    pre.textContent += HEART[i] || "";
    i++;
    if(i>=HEART.length) clearInterval(interval);
  },speed);
}

function spawnStorm(count=20){
  const w=window.innerWidth;
  const h=window.innerHeight;

  for(let i=0;i<count;i++){
    const x=rand(20,w-350);
    const y=rand(20,h-260);
    const t=makeTerminal(x,y);
    const pre=t.querySelector("pre");

    setTimeout(()=>{
      typeHeart(pre,4);
    },i*100);
  }
}

document.getElementById("yesBtn").addEventListener("click",()=>{
  card.style.display="none";
  spawnStorm(window.innerWidth < 600 ? 10 : 25);
});

document.getElementById("noBtn").addEventListener("click",()=>{
  card.innerHTML="<h1>Too bad 😤</h1><button class='yes' onclick='location.reload()'>Try Again</button>";
});

</script>

</body>
</html>

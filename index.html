<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>💘 Valentine</title>

<style>
:root{
  --win:#0b1220;
  --bar:#162033;
  --border:#25304a;
  --fg:#ff9ecb;
  --accent:#ff4d6d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
  background:
    radial-gradient(900px 700px at 20% 20%, #3a1b5a 0%, transparent 60%),
    radial-gradient(900px 700px at 80% 20%, #7b1b3a 0%, transparent 55%),
    linear-gradient(140deg,#070710,#12061a);
  color:white;
}

/* Center card */
.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}

.card{
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:20px;
  padding:28px;
  backdrop-filter:blur(10px);
  text-align:center;
}

button{
  padding:12px 20px;
  margin:10px;
  border-radius:14px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{background:#ffffff25}
button:active{transform:scale(.96)}

.yes{
  background:linear-gradient(135deg,var(--accent),#c9184a);
}

/* Desktop area */
#desktop{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* Terminal windows */
.term{
  position:absolute;
  width:320px;
  height:240px;
  background:var(--win);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 50px #000000aa;

  display:flex;
  flex-direction:column;
  pointer-events:auto;
}

.bar{
  height:30px;
  background:var(--bar);
  display:flex;
  align-items:center;
  padding:0 10px;
}

/* Mac-style dots */
.dots{
  display:flex;
  gap:6px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  cursor:pointer;
}
.dot.red{background:#ff5f57;}
.dot.yellow{background:#febc2e;}
.dot.green{background:#28c840;}

/* ASCII heart */
pre{
  margin:0;
  padding:10px;
  color:var(--fg);
  font-size:15px;
  line-height:1.05;
  white-space:pre;
  overflow:hidden;

  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:left;
}
</style>
</head>

<body>

<div class="center">
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>
</div>

<div id="desktop"></div>

<script>

const desktop = document.getElementById("desktop");
const card = document.getElementById("card");

/* HEART (UNCHANGED SHAPE) */
const HEART = `
***         *** 
******   ****** 
*************** 
*************** 
 *************  
  ***********   
    *******     
      ***       
       *        
`.trim();

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function closeWindow(win){
  win.style.transition="transform .12s ease, opacity .12s ease";
  win.style.transform="scale(0.95)";
  win.style.opacity="0";
  setTimeout(()=>win.remove(),120);
}

function makeTerminal(x,y){
  const el=document.createElement("div");
  el.className="term";
  el.style.left=x+"px";
  el.style.top=y+"px";

  el.innerHTML=`
    <div class="bar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
    </div>
    <pre></pre>
  `;

  const redDot=el.querySelector(".dot.red");
  redDot.addEventListener("click",()=>closeWindow(el));

  desktop.appendChild(el);
  return el;
}

function typeHeart(pre,speed=5){
  let i=0;
  const interval=setInterval(()=>{
    pre.textContent+=HEART[i]||"";
    i++;
    if(i>=HEART.length) clearInterval(interval);
  },speed);
}

function spawnStorm(count=20){
  const w=window.innerWidth;
  const h=window.innerHeight;

  for(let i=0;i<count;i++){
    const x=rand(20,Math.max(20,w-360));
    const y=rand(20,Math.max(20,h-260));
    const t=makeTerminal(x,y);
    const pre=t.querySelector("pre");

    setTimeout(()=>{
      typeHeart(pre,4);
    },i*90);
  }
}

document.getElementById("yesBtn").addEventListener("click",()=>{
  card.style.display="none";
  spawnStorm(window.innerWidth<600?10:25);
});

document.getElementById("noBtn").addEventListener("click",()=>{
  card.innerHTML="<h1>Too bad 😤</h1><button class='yes' onclick='location.reload()'>Try Again</button>";
});

</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>💘 Valentine</title>

<style>
:root{
  --win:#0b1220;
  --bar:#162033;
  --border:#25304a;
  --fg:#ff9ecb;
  --accent:#ff4d6d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
  background:
    radial-gradient(900px 700px at 20% 20%, #3a1b5a 0%, transparent 60%),
    radial-gradient(900px 700px at 80% 20%, #7b1b3a 0%, transparent 55%),
    linear-gradient(140deg,#070710,#12061a);
  color:white;
}

/* 🔥 Bigger Toast */
#toast{
  position:fixed;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  pointer-events:none;

  display:flex;
  align-items:center;
  gap:16px;

  background:#ffffff18;
  border:1px solid #ffffff2b;
  backdrop-filter: blur(12px);

  padding:16px 26px;
  border-radius:999px;
  font-weight:1000;
  font-size:22px;

  opacity:0;
  transition:opacity .25s ease;
}
#toast.show{ opacity:1; }

#toast img{
  width:60px;
  height:60px;
  object-fit:contain;
}

/* Center card */
.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}

.card{
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:20px;
  padding:28px;
  backdrop-filter:blur(10px);
  text-align:center;
}

button{
  padding:12px 22px;
  margin:10px;
  border-radius:14px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:white;
  font-weight:900;
  cursor:pointer;
  transition:transform .2s ease, background .2s ease;
}
button:hover{ background:#ffffff25; }
button:active{ transform:scale(.96); }

.yes{
  background:linear-gradient(135deg,var(--accent),#c9184a);
}

/* Desktop */
#desktop{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* Terminals */
.term{
  position:absolute;
  width:320px;
  height:240px;
  background:var(--win);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 50px #000000aa;
  display:flex;
  flex-direction:column;
  pointer-events:auto;
  z-index:50;
}

.bar{
  height:30px;
  background:var(--bar);
  display:flex;
  align-items:center;
  padding:0 10px;
}
.dots{ display:flex; gap:6px; }
.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  cursor:pointer;
}
.dot.red{background:#ff5f57;}
.dot.yellow{background:#febc2e;}
.dot.green{background:#28c840;}

pre{
  margin:0;
  padding:10px;
  color:var(--fg);
  font-size:15px;
  line-height:1.05;
  white-space:pre;
  overflow:hidden;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:left;
}

#noBtn.evasive{
  position:fixed;
  z-index:9998;
  transition:left .6s ease, top .6s ease;
  transform:none;
}

/* Center love text */
#loveCenter{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  pointer-events:none;
  text-align:center;
  font-weight:1000;
  color:#ffffffc2;
  text-shadow: 0 10px 30px #000000aa;
  opacity:0;
  transition: opacity .25s ease;
  font-size: clamp(24px, 4vw, 48px);
}
#loveCenter.show{ opacity:1; }

#loveBottom{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:5;
  pointer-events:none;
  text-align:center;
  font-weight:1000;
  color:#ffffffad;
  text-shadow: 0 10px 30px #000000aa;
  opacity:0;
  transition: opacity .25s ease;
  font-size: clamp(16px, 2.5vw, 24px);
}
#loveBottom.show{ opacity:1; }

#flowersBtn{
  position:fixed;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  z-index:6;
  margin:0;

  padding:12px 16px;
  border-radius:999px;
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:#fff;
  font-weight:1000;
  cursor:pointer;

  opacity:0;
  pointer-events:none;
  transition: opacity .25s ease;
}
#flowersBtn.show{
  opacity:1;
  pointer-events:auto;
}

/* Final message */
#finalScreen{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  z-index:100;
  pointer-events:none;
  opacity:0;
  transition: opacity .25s ease;
}
#finalScreen.show{ opacity:1; }
#finalScreen .finalCard{
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:22px;
  padding:30px;
  backdrop-filter: blur(12px);
  text-align:center;
  font-weight:1000;
  font-size: clamp(24px, 4vw, 40px);
}

/* 🌹 Rose confetti */
#roseConfetti{
  position:fixed;
  inset:0;
  z-index:120;
  pointer-events:none;
  overflow:hidden;
}
.rose{
  position:absolute;
  top:-40px;
  font-size:26px;
  animation: fall var(--dur) linear forwards;
}
@keyframes fall{
  to{
    transform: translate3d(var(--dx), calc(100vh + 80px), 0) rotate(var(--rot));
  }
}
</style>
</head>

<body>

<div id="toast">
  <img id="toastImg" src="">
  <span id="toastText"></span>
</div>

<div class="center" id="menu">
  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>
</div>

<div id="loveCenter">i love you babe! happy valentines day!</div>
<div id="loveBottom">-danny, your valentine.</div>

<button id="flowersBtn">wheres my flowers?</button>

<div id="finalScreen">
  <div class="finalCard">flowers are on your way!</div>
</div>

<div id="roseConfetti"></div>
<div id="desktop"></div>

<script>
/* JS unchanged from previous version except for toast sizing — keeping everything stable */
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>💘 Valentine</title>

<style>
:root{
  --bg:#0b0b12;
  --fg:#d7ffd7;
  --win:#111723;
  --bar:#1b2232;
  --border:#2a3550;
  --accent:#ff4d6d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  background:
    radial-gradient(900px 700px at 20% 20%, #3a1b5a 0%, transparent 60%),
    radial-gradient(900px 700px at 80% 20%, #7b1b3a 0%, transparent 55%),
    linear-gradient(140deg,#070710,#12061a);
  color:#fff;
}

.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
}

.card{
  width:min(720px, 94vw);
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:22px;
  padding:22px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 70px #00000088;
  text-align:center;
}

h1{margin:0 0 10px; font-size: clamp(22px, 4vw, 36px);}
p{margin:10px 0; color:#ffffffdd;}

.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

button{
  border:1px solid #ffffff33;
  background:#ffffff14;
  color:#fff;
  padding:12px 16px;
  border-radius:14px;
  font-weight:800;
  cursor:pointer;
  transition:transform .1s ease, background .2s ease;
}

button:hover{background:#ffffff1f}
button:active{transform:scale(.98)}

.yes{
  background: linear-gradient(135deg, var(--accent), #c9184a);
}

#desktop{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.term{
  position:absolute;
  width:340px;
  height:230px;
  background:var(--win);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow: 0 18px 50px #000000aa;
}

.bar{
  height:34px;
  background:var(--bar);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#cdd6ff;
}

pre{
  margin:0;
  padding:10px 12px;
  color:var(--fg);
  font-size:12px;
  line-height:1.15;
  white-space:pre;
  overflow:auto;
}
</style>
</head>

<body>

<div class="center">
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p>Choose wisely… a technical love deployment may occur.</p>
    <div class="row">
      <button class="yes" id="yesBtn">YES ✅</button>
      <button id="noBtn">NO ❌</button>
    </div>
  </div>
</div>

<div id="desktop"></div>

<script>

const desktop = document.getElementById("desktop");
const card = document.getElementById("card");

const BIG_HEART = `
  **     **   
 ****** ****** 
*************** 
 *************  
  ***********   
    *******     
      ***       
       *        
`.trimEnd();

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function makeTerminal(x,y){
  const el = document.createElement("div");
  el.className="term";
  el.style.left=x+"px";
  el.style.top=y+"px";

  el.innerHTML = `
    <div class="bar">C:\\Windows\\System32\\cmd.exe</div>
    <pre></pre>
  `;

  desktop.appendChild(el);
  return el;
}

function typeInto(pre,text,speed=8){
  let i=0;
  const interval=setInterval(()=>{
    pre.textContent += text[i] || "";
    i++;
    pre.scrollTop = pre.scrollHeight;
    if(i>=text.length) clearInterval(interval);
  },speed);
}

function terminalScript(){
  const lines=[
    "Microsoft Windows [Version 10.0.19045.0]",
    "(c) Microsoft Corporation. All rights reserved.",
    "",
    "C:\\> love.exe --deploy",
    "Loading feelings... OK",
    "Compiling hugs... OK",
    "Linking kisses... OK",
    "",
    BIG_HEART,
    "",
    "SUCCESS: You are my Valentine 💘",
    ""
  ];
  return lines.join("\n");
}

function spawnStorm(count=15){
  const w=window.innerWidth;
  const h=window.innerHeight;

  for(let i=0;i<count;i++){
    const x=rand(20,w-380);
    const y=rand(20,h-260);
    const t=makeTerminal(x,y);
    const pre=t.querySelector("pre");

    setTimeout(()=>{
      typeInto(pre,terminalScript(),6);
    },i*120);
  }
}

document.getElementById("yesBtn").addEventListener("click",()=>{
  card.innerHTML="<h1>Deployment Accepted 💘</h1><p>Initializing romantic overload...</p>";
  spawnStorm(window.innerWidth < 600 ? 8 : 18);
});

document.getElementById("noBtn").addEventListener("click",()=>{
  card.innerHTML="<h1>😤 Denied.</h1><p>Too bad. You're still my Valentine.</p><button class='yes' onclick='location.reload()'>Try Again</button>";
});

</script>

</body>
</html>
